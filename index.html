<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <svg class="flyby-plane" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M21,16v-2l-8-5V3.5C13,2.67,12.33,2,11.5,2S10,2.67,10,3.5V9l-8,5v2l8-2.5V19l-2.5,1.5V22l4-1l4,1v-1.5L13,19v-5.5L21,16z" fill="currentColor"/>
    </svg>
    <div class="topbar-inner">
      <img class="brand-icon" src="brand-icon.png" width="40" height="61" alt="" aria-hidden="true" />
      <div>
        <h1>Projects Hub</h1>
        <p class="subtitle">Il piano di volo di ogni progetto, dall'imbarco all'atterraggio.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filtra per fase">
      <button class="filter-btn is-active" data-filter="all">Tutti i voli</button>
      <button class="filter-btn" data-filter="ideation">Imbarco</button>
      <button class="filter-btn" data-filter="wip">Decollo</button>
      <button class="filter-btn" data-filter="shipment">Quota di crociera</button>
      <button class="filter-btn" data-filter="revenue">Atterraggio</button>
      <button class="add-project-btn" id="add-project-btn" aria-haspopup="dialog" title="Nuovo volo" aria-label="Nuovo volo">+</button>
    </section>

    <section id="projects" class="projects-grid" aria-label="Progetti"></section>

    <section class="ideas-section">
      <div class="ideas-header">
        <h2>Hangar</h2>
        <p class="subtitle">Idee grezze, parcheggiate in hangar. Un giorno decollano.</p>
      </div>
      <div id="ideas" class="ideas-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p id="last-updated"></p>
  </footer>

  <div id="project-dialog-overlay" class="dialog-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <button class="dialog-close" id="dialog-close" aria-label="Chiudi">&times;</button>
      <div id="dialog-content"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
