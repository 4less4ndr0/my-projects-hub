<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <svg class="brand-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2 16.5l19-6.5-1-2.7L2 12.8v3.7z" fill="currentColor"/>
        <path d="M10.5 10.8L8.7 4.2l2.4-.8 4.4 7.1-4.9 0.3z" fill="currentColor"/>
        <path d="M8.5 17.3l-3 3.8 2.2.6 3.6-3-2.8-1.4z" fill="currentColor"/>
      </svg>
      <div>
        <h1>Projects Hub</h1>
        <p class="subtitle">Stato di avanzamento di ogni progetto, da idea a revenue.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filtra per stage">
      <button class="filter-btn is-active" data-filter="all">Tutti</button>
      <button class="filter-btn" data-filter="ideation">Ideation</button>
      <button class="filter-btn" data-filter="wip">Work in progress</button>
      <button class="filter-btn" data-filter="shipment">Shipment</button>
      <button class="filter-btn" data-filter="revenue">Revenue</button>
      <button class="add-project-btn" id="add-project-btn" aria-haspopup="dialog" title="Aggiungi progetto" aria-label="Aggiungi progetto">+</button>
    </section>

    <section id="projects" class="projects-grid" aria-label="Progetti"></section>

    <section class="ideas-section">
      <div class="ideas-header">
        <h2>Idea bin</h2>
        <p class="subtitle">Idee grezze, non ancora validate. Un giorno forse.</p>
      </div>
      <div id="ideas" class="ideas-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p id="last-updated"></p>
  </footer>

  <div id="project-dialog-overlay" class="dialog-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <button class="dialog-close" id="dialog-close" aria-label="Chiudi">&times;</button>
      <div id="dialog-content"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
